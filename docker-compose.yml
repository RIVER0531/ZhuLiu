version: '3.8'

services:
  backend:
    build: ./backend
    container_name: riverflow-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
    volumes:
      - sqlite_data:/app/data
      - ./backend/riverflow.db:/app/riverflow.db
    networks:
      - riverflow-net

  frontend:
    build: ./frontend
    container_name: riverflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - riverflow-net
    depends_on:
      - backend

networks:
  riverflow-net:
    driver: bridge

volumes:
  sqlite_data:
